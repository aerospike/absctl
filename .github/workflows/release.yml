name: Publish Aerospike Backup Tools Release (Shared Workflows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (must match a release bundle already promoted to PROD, e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: read

# This workflow is run manually, once the release bundle has already been promoted all the way to
# JFrog PROD via the JFrog UI by a PM/EM (see the "Cutting a release" section in README.md -- gates past
# TEST are product-owned and intentionally not automated in CI). It never promotes anything itself;
# it only verifies the PROD promotion happened, then republishes the already-signed artifacts as an
# immutable GitHub Release. Nothing is rebuilt, re-signed, or re-checksummed here -- JFrog is the
# source of truth. Docker Hub mirroring is handled entirely externally by artifact-publisher
# (https://aerospike.atlassian.net/wiki/spaces/DevOps/pages/4648566799), triggered by JFrog's own
# promotion webhook -- no job for it lives in this workflow.
#
# GoReleaser's binary archives (from pre-release.yml's go-releaser job) already publish directly
# to GitHub Releases and bypass JFrog entirely, so they are untouched by this workflow.
#
# All `vars.JF_*` used below are dedicated to this pipeline (targets the "database" JFrog
# project) and are independent of the unprefixed `vars.*` used by promote-image-legacy.yaml
# (targets "ecosystem") — never share values between the two.

jobs:
  verify-prod-promotion:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Check release bundle is promoted to PROD
        env:
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        run: |
          set -euxo pipefail
          if [ -z "${BUNDLE_VERSION}" ]; then
            echo "::error::version input is required (e.g. v1.2.0)."
            exit 1
          fi

          echo "Checking promotion history for ${BUNDLE_NAME}:${BUNDLE_VERSION} (project: ${JF_PROJECT})..."
          RESPONSE=$(jf rt curl -s "/lifecycle/api/v2/promotion/records/${BUNDLE_NAME}/${BUNDLE_VERSION}?project=${JF_PROJECT}")
          echo "$RESPONSE" | jq .

          COMPLETED_PROD=$(echo "$RESPONSE" | jq '[.promotions[]? | select(.environment == "PROD" and .status == "COMPLETED")] | length')
          if [ "$COMPLETED_PROD" -lt 1 ]; then
            echo "::error::Release bundle ${BUNDLE_NAME}:${BUNDLE_VERSION} has no COMPLETED promotion to PROD. Have a PM/EM promote it via the JFrog UI, then re-run this workflow."
            exit 1
          fi

          echo "Confirmed: ${BUNDLE_NAME}:${BUNDLE_VERSION} is promoted to PROD."

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "### PROD promotion check"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle name | \`${BUNDLE_NAME}\` |"
            echo "| Bundle version | \`${BUNDLE_VERSION}\` |"
            echo "| JFrog project | \`${{ vars.JF_PROJECT }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-release:
    needs: [verify-prod-promotion]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Nothing here builds from source; the checkout exists only so the "Latest release"
      # decision below can compare this tag against every other release tag.
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ env.BUNDLE_VERSION }}

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Download signed artifacts from JFrog PROD
        env:
          DEB_REPO: ${{ vars.JF_ARTIFACTORY_DEB_PROD }}
          RPM_REPO: ${{ vars.JF_ARTIFACTORY_RPM_PROD }}
        run: |
          set -euxo pipefail
          # jf rt search's --bundle filter turned out not to reliably list release-bundle
          # members on our JFrog instance (verified empty against a real, promoted bundle;
          # same for --build, the bundle signature API, and release-bundle-export). Instead,
          # filter each PROD-public repo directly by the "version" property that
          # reusable_deploy-artifacts.yaml stamps on every artifact it deploys -- verified
          # live to return exact, reliable matches with full metadata (including sha256).
          mkdir -p release-assets

          echo "Searching ${DEB_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${DEB_REPO}/**" --props "version=${BUNDLE_VERSION}" > deb-artifacts.json
          echo "Searching ${RPM_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${RPM_REPO}/**" --props "version=${BUNDLE_VERSION}" > rpm-artifacts.json

          jq -s 'add' deb-artifacts.json rpm-artifacts.json > bundle-artifacts.json
          cat bundle-artifacts.json

          jq -r '.[].path' bundle-artifacts.json > artifact-paths.txt
          if [ ! -s artifact-paths.txt ]; then
            echo "::error::No package artifacts found for ${BUNDLE_NAME}:${BUNDLE_VERSION} in ${DEB_REPO} or ${RPM_REPO}." >&2
            exit 1
          fi

          echo "Artifacts to download:"
          cat artifact-paths.txt

          while IFS= read -r artifact_path; do
            jf rt download "${artifact_path}" release-assets/ --flat=true
            # GPG signature files are deterministic siblings of the primary artifact and don't
            # carry their own "version" property, so fetch them by direct sibling path instead
            # of a second search.
            jf rt download "${artifact_path}.asc" release-assets/ --flat=true --fail-no-op=false || true
          done < artifact-paths.txt

      - name: Write checksums from JFrog metadata
        run: |
          set -euxo pipefail
          # JFrog already computes and stores a sha256 for every artifact (visible in
          # bundle-artifacts.json above) -- write out that recorded checksum instead of
          # re-hashing the downloaded file locally, so the .sha256 we publish is JFrog's own
          # recorded value for this immutable artifact, not something recomputed here.
          jq -r '.[] | select(.path | test("\\.(deb|rpm)$")) | "\(.path)\t\(.sha256)"' bundle-artifacts.json |
          while IFS=$'\t' read -r artifact_path sha256; do
            filename="$(basename "$artifact_path")"
            echo "$sha256" > "release-assets/${filename}.sha256"
          done

          echo "Final release-assets tree:"
          find release-assets -type f | sort

      # GitHub's create-release API defaults make_latest to true for any non-prerelease, so
      # publishing a hotfix for an older line would repoint the repository's "Latest release"
      # backwards. Decide it the same way pre-release.yml decides the Docker `latest` tag, so
      # the two pointers cannot disagree. GoReleaser created this same release earlier as a
      # prerelease with make_latest disabled (.goreleaser.yaml); this step is what promotes it
      # to a full release, so it owns the flag from here on.
      - name: Resolve GitHub "Latest release" flag
        id: release-latest
        run: |
          set -euo pipefail
          current="${BUNDLE_VERSION#v}"

          # Final releases only: pre-release tags (v1.2.0-rc1) and one-off test tags must not
          # get a say in which release is newest.
          versions="$(
            { git tag --list 'v*'; echo "v${current}"; } \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -uV
          )"
          highest_overall="$(echo "$versions" | tail -n1)"

          if [ "$current" = "$highest_overall" ]; then
            make_latest=true
          else
            make_latest=false
          fi
          echo "MAKE_LATEST=$make_latest" >> "$GITHUB_OUTPUT"

          {
            echo "### GitHub \"Latest release\" flag"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Publishing | \`$current\` |"
            echo "| Highest release overall | \`$highest_overall\` |"
            echo "| \`make_latest\` | \`$make_latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.BUNDLE_VERSION }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.release-latest.outputs.MAKE_LATEST }}
          files: |
            release-assets/**/*.rpm
            release-assets/**/*.deb
            release-assets/**/*.deb.asc
            release-assets/**/*.rpm.asc
            release-assets/**/*.sha256

      - name: Summarize published release
        if: always()
        run: |
          {
            echo "### Published GitHub Release"
            echo "Tag: \`${BUNDLE_VERSION}\`"
            echo ""
            echo '```'
            find release-assets -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
