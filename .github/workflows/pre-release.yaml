name: Create Aerospike Backup Tools Pre Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# NOTE: every aerospike/shared-workflows `uses: ...@<sha>` below is pinned to v4.0.0.
# The `env` context isn't available in `with:` for reusable-workflow-call jobs, so gh-workflows-ref
# can't be centralized here — bump the sha and the "v4.0.0" gh-workflows-ref value together by hand.

jobs:
  go-releaser:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Import GPG key
        id: import-gpg
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SECRET_KEY }}
          passphrase: ${{ secrets.GPG_PASS }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}

  create-release:
    permissions:
      contents: write
    needs:
      - go-releaser
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check if release exists
        id: check-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            core.info(`Checking if release exists for tag: ${tag}`);
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.setOutput('release-exists', 'true');
              core.notice("Release already exists.");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('release-exists', 'false');
                core.notice("Release not found. Will create a new one.");
              } else {
                core.setFailed(`Unexpected error while checking release: ${error.message}`);
                throw error;
              }
            }

      - name: Create new release if it does not exist
        if: ${{ steps.check-release.outputs.release-exists == 'false' }}
        id: create-release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          draft: true
          prerelease: true

  # ---------------------------------------------------------------------------
  # Resolve version/build-id metadata shared by every downstream job.
  # ---------------------------------------------------------------------------

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.metadata.outputs.PACKAGE_VERSION }}
      go_version: ${{ steps.metadata.outputs.GO_VERSION }}
      packages_build_id: ${{ steps.metadata.outputs.PACKAGES_BUILD_ID }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Get Metadata
        id: metadata
        run: |
          set -x
          echo "Resolving package version from git tag..."
          PACKAGE_VERSION="${{ github.ref_name }}"
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "Could not resolve package version from github.ref_name." >&2
            exit 1
          fi

          echo "Resolving Go toolchain version for Docker build-args..."
          GO_VERSION="$( curl -s 'https://go.dev/dl/?mode=json&include=all' | \
          jq -r --arg ver "go$(go mod edit -json | \
          jq -r '.Go' | cut -d. -f1-2)" '.[] | select(.version | startswith($ver)) | .version' | \
          sort -V | tail -n1 | cut -c3- | tr -d '\n')"
          if [ -z "$GO_VERSION" ]; then
            echo "Failed to resolve Go version." >&2
            exit 1
          fi

          BUILD_ID_BASE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Resolved metadata:"
          echo "  PACKAGE_VERSION: $PACKAGE_VERSION"
          echo "  GO_VERSION: $GO_VERSION"
          echo "  BUILD_ID_BASE: $BUILD_ID_BASE"

          {
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "PACKAGES_BUILD_ID=${BUILD_ID_BASE}-packages"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved release metadata"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package version | \`$PACKAGE_VERSION\` |"
            echo "| Go toolchain version | \`$GO_VERSION\` |"
            echo "| Packages build ID | \`${BUILD_ID_BASE}-packages\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # DEB/RPM packages: build -> sign -> deploy
  # ---------------------------------------------------------------------------

  build-packages:
    needs: [create-release, prepare]
    permissions:
      contents: read
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_execute-build.yaml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      gh-workflows-ref: v4.0.0
      jf-project: ${{ vars.JFROG_CLI_BUILD_PROJECT }}
      jf-build-name: absctl-packages
      jf-build-id: ${{ needs.prepare.outputs.packages_build_id }}
      # reusable_execute-build.yaml checks the source repo out under gh-source-path
      # (default: local), not at the workspace root, so build-script must cd there.
      working-directory: local
      build-script: |
        set -x
        echo "Working directory: $(pwd)"
        ls -la
        # Pin nfpm to a known version and verify it against nfpm's published checksums
        # instead of trusting `go install ...@latest` (an unreviewed, unpinned moving target).
        NFPM_VERSION="2.47.0"
        NFPM_DEB="nfpm_${NFPM_VERSION}_amd64.deb"
        curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_DEB}"
        curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
        grep " ${NFPM_DEB}\$" checksums.txt | sha256sum -c -
        sudo apt-get install -y "./${NFPM_DEB}"
        make packages BUILD_MODE=release
        echo "Packaged artifacts:"
        ls -la dist
      gh-artifact-directory: dist
      gh-artifact-name: packages-unsigned
      gh-retention-days: 1

  sign-packages:
    needs: [build-packages]
    # reusable_sign-artifacts.yaml declares id-token: write at its own workflow level;
    # GitHub requires the caller to grant at least that, even though this job's steps
    # don't use OIDC themselves.
    permissions:
      contents: read
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      gh-workflows-ref: v4.0.0
      gh-unsigned-artifacts: packages-unsigned
      gh-artifact-name: packages-signed
      gh-retention-days: 7
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  deploy-packages:
    needs: [prepare, sign-packages]
    # reusable_deploy-artifacts.yaml's nested `deploy` job declares actions: write at job
    # scope (for the optional Maven bundle-metadata upload, unused here). GitHub's static
    # validation requires it to be granted by the caller even though it's never exercised.
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      gh-workflows-ref: v4.0.0
      jf-project: ${{ vars.JFROG_CLI_BUILD_PROJECT }}
      jf-build-name: absctl-packages
      jf-build-id: ${{ needs.prepare.outputs.packages_build_id }}
      version: ${{ needs.prepare.outputs.package_version }}
      gh-artifact-name: packages-signed

  # ---------------------------------------------------------------------------
  # Docker image: build, attest, and push to JFrog in one call
  # ---------------------------------------------------------------------------

  build-docker-image:
    needs: [create-release, prepare]
    # reusable_docker-build-deploy.yaml declares no top-level permissions, but its nested
    # `build` and `merge` jobs request packages: write (build+merge) and attestations: write
    # (merge, for SLSA provenance) at job scope. GitHub validates these nested requests too.
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      jf-project: ${{ vars.JFROG_CLI_BUILD_PROJECT }}
      jf-registry: ${{ vars.ARTIFACTORY_REGISTRY_URL }}/${{ vars.ARTIFACTORY_CONTAINER_DEV }}
      jf-build-name: absctl-container
      image-name: absctl
      app-name: Aerospike Backup CLI
      app-version: ${{ needs.prepare.outputs.package_version }}
      context: .
      file: Dockerfile
      build-args-json: >-
        {"GO_VERSION":"${{ needs.prepare.outputs.go_version }}","REGISTRY":"docker.io","BUILD_MODE":"release","VERSION":"${{ needs.prepare.outputs.package_version }}"}
      labels-json: >-
        {"org.opencontainers.image.title":"Aerospike Backup CLI",
        "org.opencontainers.image.description":"Command-line tool for backing up and restoring Aerospike data",
        "org.opencontainers.image.documentation":"https://github.com/aerospike/absctl?tab=readme-ov-file#absctl",
        "org.opencontainers.image.base.name":"docker.io/alpine:3.23",
        "org.opencontainers.image.vendor":"Aerospike",
        "org.opencontainers.image.licenses":"Apache-2.0"}

  # ---------------------------------------------------------------------------
  # Unified release bundle
  # ---------------------------------------------------------------------------

  create-release-bundle:
    needs: [prepare, deploy-packages, build-docker-image]
    # reusable_create-release-bundle.yaml's nested job declares actions: read at job scope
    # (for the optional Maven bundle-metadata download, unused here). Same static-validation
    # requirement as the id-token/actions: write cases above.
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      gh-workflows-ref: v4.0.0
      jf-project: ${{ vars.JFROG_CLI_BUILD_PROJECT }}
      jf-bundle-name: absctl
      version: ${{ needs.prepare.outputs.package_version }}
      # single unbroken line: a YAML folded/quoted scalar wrapped across lines here would inject
      # a stray space after each comma, which a naive `IFS=','` split downstream would not trim.
      # NOTE: the container build's JFrog build-NUMBER is github.run_number (the setup-jfrog-cli
      # default), not app-version — reusable_docker-build-deploy.yaml has no jf-build-id input.
      jf-build-names: absctl-packages:${{ needs.prepare.outputs.package_version }},absctl-container:${{ github.run_number }}

  # ---------------------------------------------------------------------------
  # GitHub Release assets (no shared-workflow equivalent)
  # ---------------------------------------------------------------------------

  publish-release-assets:
    # create-release must land first: it creates the draft/prerelease GitHub Release.
    # Without this dependency, action-gh-release below could race ahead and create a
    # live, non-draft release instead.
    needs: [create-release, sign-packages]
    permissions:
      contents: write
    # aerospike/shared-workflows setup-gpg (used below) hard-fails on anything but 22.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-signed
          path: signed-packages

      - name: List downloaded packages
        run: |
          set -x
          echo "Downloaded signed-packages contents:"
          find signed-packages -type f -exec ls -la {} \;

      - name: setup GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: Create and sign checksums
        env:
          GPG_TTY: no-tty
          GPG_PASSPHRASE: ${{ secrets.GPG_PASS }}
        run: |
          set -x
          echo "Generating checksums for signed .deb/.rpm packages..."
          find signed-packages -type f \( -name '*.deb' -o -name '*.rpm' \) \
            -exec sh -c 'sha256sum "$1" | cut -d" " -f1 > "$1.sha256"' _ {} \;

          CHECKSUM_COUNT=$(find signed-packages -type f -name '*.sha256' | wc -l)
          echo "Generated $CHECKSUM_COUNT checksum file(s)."
          if [ "$CHECKSUM_COUNT" -eq 0 ]; then
            echo "No checksum files were generated." >&2
            exit 1
          fi

          echo "Signing checksum files..."
          find signed-packages -type f -name '*.sha256' | while read -r file; do
            gpg --detach-sign --no-tty --batch --yes --output "${file}.asc" --passphrase "$GPG_PASSPHRASE" "${file}"
            gpg --verify "${file}.asc" "${file}" &>/dev/null
            echo "Signed and verified ${file}"
          done

          echo "Final signed-packages tree:"
          find signed-packages -type f | sort

      - name: Upload Assets to GitHub Release
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            signed-packages/**/*.rpm
            signed-packages/**/*.deb
            signed-packages/**/*.sha256
            signed-packages/**/*.sha256.asc

      - name: Summarize published assets
        if: always()
        run: |
          {
            echo "### Published GitHub Release assets"
            echo "Tag: \`${{ github.ref_name }}\`"
            echo ""
            echo '```'
            find signed-packages -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
